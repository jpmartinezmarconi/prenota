name: Check Prenot@mi appointments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué quieres ejecutar"
        required: true
        default: test
        type: choice
        options:
          - test
          - check

permissions:
  contents: read

jobs:
  check-appointment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check appointment availability
        env:
          PRENOTAMI_EMAIL: ${{ secrets.PRENOTAMI_EMAIL }}
          PRENOTAMI_PASSWORD: ${{ secrets.PRENOTAMI_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          SERVICE_NAME: renovación de pasaporte
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            test -n "$TELEGRAM_TOKEN" || { echo "Falta el Secret TELEGRAM_TOKEN"; exit 1; }
            test -n "$CHAT_ID" || { echo "Falta el Secret CHAT_ID"; exit 1; }
            python bot.py --test-telegram
          else
            test -n "$PRENOTAMI_EMAIL" || { echo "Falta el Secret PRENOTAMI_EMAIL"; exit 1; }
            test -n "$PRENOTAMI_PASSWORD" || { echo "Falta el Secret PRENOTAMI_PASSWORD"; exit 1; }
            test -n "$BOOKING_URL" || { echo "Falta el Secret BOOKING_URL"; exit 1; }
            python bot.py --once
          fi